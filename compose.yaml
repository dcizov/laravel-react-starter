services:
    laravel.test:
        build:
            context: ./vendor/laravel/sail/runtimes/8.5
            dockerfile: Dockerfile
            args:
                # 1000 is the first user on virtually every distribution, so the
                # image builds without configuration. Override in `.env` when
                # your uid/gid differ (`id -u`, `id -g`).
                #
                # The value has to come from `.env`, not from the invoking shell:
                # under distrobox `docker` is `distrobox-host-exec` → `host-spawn`,
                # which forwards only TERM and PWD (its `--env` default), so
                # anything Sail exports inside the container never reaches the
                # docker CLI running on the host. `.env` is read by compose
                # itself, on the host, and is therefore the reliable channel.
                WWWGROUP: '${WWWGROUP:-1000}'
        image: sail-8.5/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            # `php artisan dev` / `composer dev` runs the built-in server here.
            - '${FORWARD_SERVE_PORT:-8000}:8000'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            # Same reasoning as the build arg above: `.env` is the channel that
            # survives a distrobox host-exec boundary. The entrypoint runs
            # `usermod -u $WWWUSER sail` when this is non-empty, which is what
            # keeps `storage/` and `bootstrap/cache` owned by you.
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            # `artisan serve` binds 127.0.0.1 by default, which a published
            # port cannot reach; listen on every interface inside the container.
            SERVER_HOST: '0.0.0.0'
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            pgsql:
                # Wait for the health check, otherwise `sail composer setup`
                # right after `sail up -d` races the database.
                condition: service_healthy
            mailpit:
                condition: service_started
    pgsql:
        image: 'postgres:18-alpine'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE:-lattice}'
            POSTGRES_USER: '${DB_USERNAME:-sail}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            - './vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                [
                    'CMD',
                    'pg_isready',
                    '-q',
                    '-d',
                    '${DB_DATABASE:-lattice}',
                    '-U',
                    '${DB_USERNAME:-sail}',
                ]
            retries: 3
            timeout: 5s
    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail
networks:
    sail:
        driver: bridge
volumes:
    sail-pgsql:
        driver: local
