name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # Postgres is what Lattice ships (Sail and .env.example), SQLite is what a
    # developer gets without Docker. Both legs run the same suite, so a
    # driver-specific regression cannot pass unnoticed.
    strategy:
      fail-fast: false
      matrix:
        database: [pgsql, sqlite]

    env:
      DB_CONNECTION: ${{ matrix.database }}
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: ${{ matrix.database == 'pgsql' && 'laravel' || '' }}
      DB_USERNAME: sail
      DB_PASSWORD: secret

    services:
      pgsql:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: laravel
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sail -d laravel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          extensions: pdo_pgsql, pgsql
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Create testing database
        if: matrix.database == 'pgsql'
        run: |
          php -r '
            $pdo = new PDO("pgsql:host=127.0.0.1;port=5432;dbname=postgres", "sail", "secret");
            $pdo->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);
            try {
                $pdo->exec("CREATE DATABASE testing");
            } catch (PDOException $e) {
                echo "Testing database may already exist: " . $e->getMessage() . PHP_EOL;
            }
          '

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
